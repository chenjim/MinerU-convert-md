# 开机自启：restart 刻意为 "no" —— dockerd 开机会把带策略的容器一波并行恢复，
# 全机容器统一由宿主 ~/.local/bin/containers-stagger.sh（root crontab @reboot）自动分批拉起
services:
  mineru-convert:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mineru-convert-md
    ports:
      - "56784:56784"
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./tests:/app/tests
      - model_cache:/root/.cache/mineru
    environment:
      - MINERU_BACKEND=pipeline
    env_file:
      - path: .env
        required: false
    restart: "no"

volumes:
  model_cache:

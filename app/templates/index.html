<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MinerU 文档转换</title>
  <script>
    // 尽早设置主题，避免深色模式首次渲染闪白
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : sys;
      } catch (e) {}
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      color-scheme: light;
      --bg: #f5f5f5; --card-bg: #fff;
      --text: #222; --text-soft: #555; --muted: #666; --dim: #999;
      --border: #ccc; --border-soft: #eee; --track: #e0e0e0;
      --accent: #4A90D9; --accent-hover: #357ABD; --danger: #d33;
      --shadow: rgba(0,0,0,.08);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #121212; --card-bg: #1e1e1e;
      --text: #e6e6e6; --text-soft: #c2c2c2; --muted: #a6a6a6; --dim: #8a8a8a;
      --border: #3a3a3a; --border-soft: #2e2e2e; --track: #333;
      --accent: #5AA0E9; --accent-hover: #6FB0EE; --danger: #ff6b6b;
      --shadow: rgba(0,0,0,.5);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; justify-content: center; padding: 40px 20px;
      transition: background .2s, color .2s;
    }
    .container { max-width: 640px; width: 100%; }
    .card {
      position: relative;
      background: var(--card-bg); border-radius: 12px; padding: 32px;
      box-shadow: 0 2px 8px var(--shadow);
      transition: background .2s;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .subtitle.meta { font-size: 12px; color: var(--dim); margin-top: -16px; }

    .theme-btn {
      position: absolute; top: 16px; right: 16px;
      width: 34px; height: 34px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; color: var(--muted);
      border: 1px solid var(--border-soft); cursor: pointer;
      transition: color .2s, border-color .2s, background .2s;
    }
    .theme-btn:hover { color: var(--text); border-color: var(--border); }
    .theme-btn svg { width: 18px; height: 18px; }
    .theme-btn .icon-sun { display: none; }
    :root[data-theme="dark"] .theme-btn .icon-sun { display: block; }
    :root[data-theme="dark"] .theme-btn .icon-moon { display: none; }

    .drop-zone {
      border: 2px dashed var(--border); border-radius: 8px;
      padding: 48px 24px; text-align: center; cursor: pointer;
      transition: border-color .2s;
    }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); }
    .drop-zone .icon { font-size: 36px; color: var(--dim); margin-bottom: 8px; }
    .drop-zone p { color: var(--muted); }
    .formats { color: var(--dim); font-size: 13px; margin-top: 8px; }
    #fileInput { display: none; }
    .btn {
      display: inline-block;
      background: var(--accent); color: #fff; border: none;
      padding: 10px 28px; border-radius: 6px; cursor: pointer;
      font-size: 15px;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { background: var(--dim); cursor: not-allowed; }

    .actions {
      display: flex; align-items: center; justify-content: center;
      gap: 16px; margin-top: 16px; flex-wrap: wrap;
    }
    .opt-toggle {
      display: flex; align-items: center; gap: 6px;
      font-size: 14px; color: var(--text-soft); cursor: pointer; user-select: none;
    }
    .opt-toggle input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }

    .progress-wrap {
      margin-top: 20px; border-top: 1px solid var(--border-soft); padding-top: 16px;
    }
    .progress-bar {
      width: 100%; height: 8px; background: var(--track); border-radius: 4px;
      overflow: hidden; margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #67B8F0);
      border-radius: 4px; transition: width .6s ease;
    }
    .progress-label { font-size: 14px; color: var(--text); text-align: center; }
    .progress-warn { font-size: 12px; color: var(--dim); text-align: center; margin-top: 4px; }

    .result {
      margin-top: 20px; border-top: 1px solid var(--border-soft); padding-top: 16px;
    }
    .result a { color: var(--accent); }
    .error { color: var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <button class="theme-btn" id="themeBtn" type="button" aria-label="切换深色模式" title="切换深色模式">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <h1><a href="https://h89.cn/archives/664.html" target="_blank" style="text-decoration:none;color:inherit">MinerU 文档转换</a></h1>
      <p class="subtitle">PDF / DOCX / PPTX / XLSX / 图片 → Markdown</p>
      <p class="subtitle meta">MinerU pipeline + PP-OCRv6 | 单文件最大 100MB</p>

      <div class="drop-zone" id="dropZone">
        <div class="icon">📄</div>
        <p>拖拽文件到此处，或点击选择</p>
        <p class="formats">支持: PDF, DOCX, PPTX, XLSX, PNG, JPG</p>
      </div>
      <input type="file" id="fileInput" accept=".pdf,.docx,.pptx,.xlsx,.png,.jpg,.jpeg">

      <div class="actions">
        <label class="opt-toggle">
          <input type="checkbox" id="altToggle">
          <span>补充图片描述（alt）</span>
        </label>
        <label class="opt-toggle">
          <input type="checkbox" id="optimizeToggle">
          <span>大模型优化排版（耗时增加）</span>
        </label>
        <button class="btn" id="convertBtn" disabled>转换</button>
      </div>

      <div class="progress-wrap" id="progressWrap" style="display:none">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-label" id="progressLabel"></div>
        <div class="progress-warn" id="progressWarn"></div>
      </div>

      <div class="result" id="result"></div>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const convertBtn = document.getElementById('convertBtn');
    const optimizeToggle = document.getElementById('optimizeToggle');
    const altToggle = document.getElementById('altToggle');
    const themeBtn = document.getElementById('themeBtn');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');
    const progressWarn = document.getElementById('progressWarn');
    const result = document.getElementById('result');
    let selectedFile = null;

    themeBtn.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch (e) {}
    });

    function setProgress(pct, phase) {
      progressFill.style.width = Math.min(pct, 100) + '%';
      progressLabel.textContent = phase;
      progressWarn.textContent = pct > 0 && pct < 100 ? '请勿刷新页面' : '';
    }

    function updateDropText(name) {
      dropZone.querySelector('p').textContent = name;
      dropZone.querySelector('.formats').textContent = '';
    }

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault(); dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        selectedFile = e.dataTransfer.files[0];
        updateDropText(selectedFile.name);
        convertBtn.disabled = false;
      }
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) {
        selectedFile = fileInput.files[0];
        updateDropText(selectedFile.name);
        convertBtn.disabled = false;
      }
    });

    convertBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      convertBtn.disabled = true;
      result.innerHTML = '';
      progressWrap.style.display = 'block';

      const form = new FormData();
      form.append('file', selectedFile);

      try {
        setProgress(5, '上传中...');
        const upRes = await fetch('/upload', { method: 'POST', body: form });
        const upData = await upRes.json();
        if (!upData.success) {
          throw new Error(upData.detail || '上传失败');
        }
        const fileId = upData.file_id;

        setProgress(5, '排队中...');
        const optimize = optimizeToggle.checked ? 'true' : 'false';
        const alt = altToggle.checked ? 'true' : 'false';
        const cvRes = await fetch(`/convert/${fileId}?optimize=${optimize}&alt=${alt}`, { method: 'POST' });
        if (!cvRes.ok) {
          const err = await cvRes.json().catch(() => ({}));
          throw new Error(err.detail || '转换启动失败');
        }

        while (true) {
          const stRes = await fetch(`/status/${fileId}`);
          const stData = await stRes.json();
          if (stData.status === 'done') break;
          if (stData.status === 'error') throw new Error(stData.error || '转换失败');
          setProgress(stData.pct, stData.phase || '转换中...');
          await new Promise(r => setTimeout(r, 2000));
        }
        setProgress(100, '✅ 转换完成');
        const zipLink = `/download/${fileId}?zip=true`;
        result.innerHTML = `<a href="${zipLink}">下载转换结果 (zip)</a>`;
      } catch (e) {
        progressWrap.style.display = 'none';
        result.innerHTML = `<span class="error">${e.message}</span>`;
      } finally {
        convertBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
